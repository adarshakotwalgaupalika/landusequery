<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>आदर्शकोतवाल गाउँपालिका - भू-उपयोग वर्गीकरण</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <!-- Custom Styles -->
  <style>
    body {
      font-family: "Noto Sans Devanagari", sans-serif;
      background-color: #f8f9fa;
    }

    /* Header Bar */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #4C4CFF;
      color: #fff;
      padding: 15px 30px;
      border-bottom: 2px solid #dee2e6;
      position: relative;
    }

    .header-bar img {
      height: 70px;
    }

    .header-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      line-height: 1.6;
    }

    /* Card Styling */
    .card-custom {
      border-radius: 15px;
      border: none;
      background: #fff;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
    }

    /* Login Section */
    #login-card {
      max-width: 400px;
      margin: 120px auto;
      border-radius: 15px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
      padding: 30px;
      background-color: #fff;
    }

    #main-content {
      display: none; /* Hidden until successful login */
    }
  </style>
</head>

<body>
  <!-- Header -->
  <div class="header-bar">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/37/Emblem_of_Nepal_%28alternative%29.svg/256px-Emblem_of_Nepal_%28alternative%29.svg.png" alt="Nepal Emblem">
    
    <div class="header-title">
      <div>आदर्शकोतवाल गाउँपालिका</div>
      <div>गाउँ कार्यपालिकाको कार्यालय</div>
      <div>महेन्द्रआदर्श, बारा</div>
      <div>मधेश प्रदेश</div>
    </div>

    <img src="https://giwmscdntwo.gov.np/static/grapejs/img/Nepal-flag.gif" alt="Nepal Flag">
  </div>

  <!-- Login Card -->
  <div id="login-card" class="card">
    <h4 class="text-center mb-4">लगइन गर्नुहोस्</h4>

    <div class="mb-3">
      <label for="username" class="form-label">प्रयोगकर्ता नाम:</label>
      <input type="text" id="username" class="form-control" placeholder="Username राख्नुहोस्">
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">पासवर्ड:</label>
      <input type="password" id="password" class="form-control" placeholder="Password राख्नुहोस्">
    </div>

    <button class="btn btn-primary w-100" onclick="login()">Login</button>
    <p id="login-error" class="text-danger text-center mt-3" style="display:none;">❌ गलत प्रयोगकर्ता नाम वा पासवर्ड !</p>
  </div>

  <!-- Marquee Notice -->
<div class="bg-warning py-2">
  <marquee behavior="scroll" direction="left" scrollamount="6">
    📢 सूचना: यो प्रणाली आदर्शकोतवाल गाउँपालिकाको आधिकारिक भू-उपयोग तथा कित्तागत विवरण हेर्न प्रयोग गरिन्छ । 
    कृपया सही विवरण प्रविष्ट गर्नुहोस् ।
  </marquee>
</div> <br> <br>


    <div class="card card-custom p-4">
      <!-- VDC Dropdown -->
      <div class="mb-3">
        <label for="vdc" class="form-label">गा.वि.स.:</label>
        <select id="vdc" class="form-select" onchange="populateWards()">
          <option value="">-- गाविस छान्नुस --</option>
          <!-- VDC options will be added here -->
        </select>
      </div>

      <!-- Ward Dropdown -->
      <div class="mb-3">
        <label for="ward" class="form-label">वडा नं/सिट नं:</label>
        <select id="ward" class="form-select">
          <option value="">-- वार्ड छान्नुस --</option>
        </select>
      </div>

      <!-- Parcel Input -->
      <div class="mb-3">
        <label for="parcel" class="form-label">कित्ता नं:</label>
        <input type="text" id="parcel" class="form-control" placeholder="कित्ता नं राख्नुस">
      </div>

      <!-- Search Button -->
      <button id="searchBtn" class="btn btn-primary w-100" onclick="queryData()">🔍 खोज्नुहोस्</button>

      <!-- Progress Bar -->
      <div class="progress mt-3" style="display:none;">
        <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width:100%"></div>
      </div>
    </div>

    <!-- Results Section -->
    <div id="results" class="mt-5"></div>
  </div>

  <!-- Scripts -->
  <script>
    // --- Login System ---
    const validUsername = "adarshakotwal";
    const validPassword = "12345";

    function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('login-error');

      if (username === validUsername && password === validPassword) {
        document.getElementById('login-card').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
      } else {
        errorMsg.style.display = 'block';
      }
    }

    // --- Placeholder for ward and parcel logic ---
    function populateWards() {
      const wardDropdown = document.getElementById('ward');
      wardDropdown.innerHTML = `
        <option value="">-- वार्ड छान्नुस --</option>
        <option value="1">१</option>
        <option value="2">२</option>
        <option value="3">३</option>
        <option value="4">४</option>
        <option value="5">५</option>
      `;
    }

    // --- Query Data Function (Mock Example) ---
    function queryData() {
      const vdc = document.getElementById('vdc').value;
      const ward = document.getElementById('ward').value;
      const parcel = document.getElementById('parcel').value;
      const results = document.getElementById('results');
      const progress = document.querySelector('.progress');

      if (!vdc || !ward || !parcel) {
        alert('कृपया सम्पूर्ण विवरण भर्नुहोस्!');
        return;
      }

      progress.style.display = 'block';
      results.innerHTML = '';

      setTimeout(() => {
        progress.style.display = 'none';
        results.innerHTML = `
          <div class="alert alert-success">
            <strong>नतिजा:</strong> गाविस: ${vdc}, वडा: ${ward}, कित्ता नं: ${parcel} को विवरण भेटियो।
          </div>
        `;
      }, 1500);
    }
  </script>

  <!-- Optional JS File -->
   <script src="script.js"></script>
</body>
</html>
